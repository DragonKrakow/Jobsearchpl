<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Search PL - Find Your Job</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .results {
            margin-top: 20px;
        }
        
        .source-section {
            margin-bottom: 30px;
        }
        
        .source-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0 10px 0;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .job-item {
            background: #f5f5f5;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .job-item:hover {
            background: #efefef;
        }
        
        .job-item a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            word-break: break-word;
        }
        
        .job-item a:hover {
            text-decoration: underline;
        }
        
        .job-source {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            padding: 20px;
        }
        
        .no-results {
            color: #999;
            text-align: center;
            padding: 20px;
        }
        
        .error {
            background: #ffe0e0;
            color: #c00;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .info-section {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 30px;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
        
        .info-section h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Job Search PL</h1>
        <p class="subtitle">Find job opportunities in Poland</p>
        
        <div class="search-form">
            <input 
                type="text" 
                id="keywordInput" 
                placeholder="Enter keywords (e.g., Python, JavaScript, Data Science...)"
                autocomplete="off"
            >
            <button onclick="searchJobs()">Search</button>
        </div>
        
        <div id="results" class="results"></div>
        
        <div class="info-section">
            <h3>ℹ️ How to use:</h3>
            <ol style="margin-left: 20px;">
                <li>Enter job keywords in the search box</li>
                <li>Click "Search" to find related job listings</li>
                <li>Click on any job link to view details</li>
            </ol>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://jobsearchpl.onrender.com';
        
        function searchJobs() {
            const keyword = document.getElementById('keywordInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!keyword) {
                resultsDiv.innerHTML = '<p class="no-results">Please enter a keyword to search</p>';
                return;
            }
            
            // Show loading
            resultsDiv.innerHTML = '<p class="loading">⏳ Searching for jobs...</p>';
            
            // Call API
            fetch(`${API_URL}/api/search?keyword=${encodeURIComponent(keyword)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        resultsDiv.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                        return;
                    }
                    
                    const totalResults = data.total_results || 0;
                    
                    if (totalResults === 0) {
                        resultsDiv.innerHTML = `<p class="no-results">No jobs found for "${keyword}"</p>`;
                        return;
                    }
                    
                    let html = `<p style="color: #667eea; font-weight: bold; margin-bottom: 20px;">Found ${totalResults} jobs across all platforms</p>`;
                    
                    // Pracuj.pl results
                    if (data.pracuj_pl && data.pracuj_pl.length > 0) {
                        html += '<div class="source-section">';
                        html += '<div class="source-title">💼 Pracuj.pl</div>';
                        data.pracuj_pl.forEach(job => {
                            html += `
                                <div class="job-item">
                                    <a href="${job.url}" target="_blank">${job.title}</a>
                                    <div class="job-source">From: ${job.source}</div>
                                </div>
                            `;
                        });
                        html += '</div>';
                    }
                    
                    // LinkedIn results
                    if (data.linkedin && data.linkedin.length > 0) {
                        html += '<div class="source-section">';
                        html += '<div class="source-title">💼 LinkedIn</div>';
                        data.linkedin.forEach(job => {
                            html += `
                                <div class="job-item">
                                    <a href="${job.url}" target="_blank">${job.title}</a>
                                    <div class="job-source">From: ${job.source}</div>
                                </div>
                            `;
                        });
                        html += '</div>';
                    }
                    
                    resultsDiv.innerHTML = html;
                })
                .catch(error => {
                    resultsDiv.innerHTML = `<p class="error">Error connecting to API: ${error.message}</p>`;
                    console.error('API Error:', error);
                });
        }
        
        // Allow search on Enter key
        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchJobs();
            }
        });
    </script>
</body>
</html>
